# 特殊时间段 / 特殊事件
# 默认：每天北京时间 07:00 运行，窗口为前一天 07:00 至当天 07:00，事件为"无特定事件，只要近期新闻"。
# 需要定制时，在下面加一条。只在 run_date 当天生效，过期自动忽略，不用删。
# 某天出错要补跑：加一条该日期，然后在 claude.ai/code/routines 点 "Run now"。
#
# 示例：
# - run_date: 2026-11-25
#   window: "2026-11-23 07:00 ~ 2026-11-25 07:00"   # 不写则用默认 24 小时
#   companies:                                       # 只写需要定制的公司，id 见 data/companies.yaml
#     xiaomi: "于北京时间2026年11月24日发布第三季度财报"
#   only: [xiaomi, catl]                             # 可选：这次只跑这几家

overrides: []
